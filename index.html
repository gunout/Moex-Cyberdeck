<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOEX CYBERDECK v4.0 // MOSCOW EXCHANGE</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>

<style>
:root{
  --bg-deep:#0a0a0f;
  --bg-panel:rgba(15,15,25,0.75);
  --ru-red:#d52b1e;
  --ru-blue:#0039a6;
  --ru-white:#ffffff;
  --neon-cyan:#00f3ff;
  --neon-gold:#ffd700;
  --neon-green:#00ff9d;
  --neon-red:#ff0055;
  --text-main:#e0f7fa;
  --text-dim:#5c7c8a;
  --font-display:'Orbitron',sans-serif;
  --font-data:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background-color:var(--bg-deep);
  color:var(--text-main);
  font-family:var(--font-display);
  height:100vh;overflow:hidden;
  background-image:
    radial-gradient(circle at 15% 15%, rgba(213,43,30,0.08) 0%, transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(0,57,166,0.10) 0%, transparent 45%),
    linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%),
    linear-gradient(90deg, rgba(255,0,0,0.04), rgba(255,255,255,0.02), rgba(0,0,255,0.04));
  background-size:100% 100%, 100% 100%, 100% 2px, 3px 100%;
}
.app{display:grid;grid-template-columns:320px 1fr 340px;height:100vh}

.panel{
  background:var(--bg-panel);
  border-right:1px solid rgba(0,243,255,0.2);
  display:flex;flex-direction:column;overflow:hidden;
  backdrop-filter:blur(12px);
  box-shadow:0 0 25px rgba(0,0,0,0.6);
  position:relative;
}
.panel::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg, var(--ru-white), var(--ru-blue), var(--ru-red), var(--ru-white));
  opacity:0.85;
}
.panel-header{
  padding:14px 16px;border-bottom:1px solid rgba(0,243,255,0.2);
  font-weight:700;color:var(--neon-cyan);text-transform:uppercase;
  font-size:11px;letter-spacing:2px;
  display:flex;justify-content:space-between;align-items:center;
  text-shadow:0 0 5px rgba(0,243,255,0.5);
  flex-shrink:0;
}
.panel-content{
  flex:1;overflow-y:auto;padding:10px;
  font-family:var(--font-data);
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#000}
::-webkit-scrollbar-thumb{background:var(--neon-cyan);border-radius:3px;box-shadow:0 0 5px var(--neon-cyan)}
::-webkit-scrollbar-thumb:hover{background:var(--neon-gold)}

/* Search bar */
.search-bar{
  padding:8px 10px;
  border-bottom:1px solid rgba(0,243,255,0.15);
  background:rgba(0,0,0,0.3);
}
.search-input{
  width:100%;
  background:rgba(0,0,0,0.4);
  border:1px solid rgba(0,243,255,0.3);
  color:#fff;
  padding:8px 12px;
  border-radius:4px;
  font-family:var(--font-data);
  font-size:12px;
  letter-spacing:1px;
  transition:all 0.2s;
  outline:none;
}
.search-input:focus{
  border-color:var(--neon-gold);
  box-shadow:0 0 12px rgba(255,215,0,0.3);
}
.search-input::placeholder{color:var(--text-dim);letter-spacing:1px}

/* IMOEX banner */
.imoex-banner{
  padding:12px 15px;
  background:linear-gradient(135deg, rgba(213,43,30,0.15), rgba(0,57,166,0.15));
  border-bottom:1px solid rgba(0,243,255,0.2);
  display:flex;justify-content:space-between;align-items:center;
  flex-shrink:0;
}
.imoex-label{
  font-size:10px;color:var(--text-dim);letter-spacing:2px;
  text-transform:uppercase;margin-bottom:2px;
}
.imoex-value{
  font-family:var(--font-data);font-size:18px;font-weight:700;
  color:#fff;
}
.imoex-change{
  font-family:var(--font-data);font-size:12px;font-weight:600;
  margin-top:2px;
}

/* Watchlist */
.watchlist-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 12px;border-radius:5px;cursor:pointer;
  transition:all 0.2s;margin-bottom:5px;
  border-left:3px solid transparent;
  background:rgba(0,243,255,0.02);
  position:relative;
}
.watchlist-item:hover{
  background:rgba(0,243,255,0.1);
  box-shadow:inset 3px 0 0 var(--neon-cyan);
  transform:translateX(2px);
}
.watchlist-item.active{
  background:linear-gradient(90deg, rgba(0,243,255,0.18), rgba(213,43,30,0.08));
  border-left-color:var(--neon-gold);
  box-shadow:0 0 15px rgba(255,215,0,0.15);
}
.watchlist-item.alert{animation:alertPulse 1.5s infinite}
@keyframes alertPulse{
  0%,100%{background:rgba(255,0,85,0.05)}
  50%{background:rgba(255,0,85,0.2)}
}
.watchlist-symbol{font-weight:700;font-size:14px;color:#fff;letter-spacing:1px}
.watchlist-name{font-size:10px;color:var(--text-dim);margin-top:3px;text-transform:uppercase;letter-spacing:0.5px}
.watchlist-price{font-weight:700;font-size:13px;color:#fff;font-family:var(--font-data)}
.watchlist-change{font-size:11px;text-align:right;margin-top:2px;font-family:var(--font-data)}

.sector-badge{
  display:inline-block;
  font-size:8px;
  padding:2px 6px;
  border-radius:3px;
  margin-left:6px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:700;
  vertical-align:middle;
}
.sector-energy{background:rgba(255,215,0,0.2);color:#ffd700;border:1px solid rgba(255,215,0,0.4)}
.sector-finance{background:rgba(0,243,255,0.2);color:#00f3ff;border:1px solid rgba(0,243,255,0.4)}
.sector-tech{background:rgba(255,0,255,0.2);color:#ff00ff;border:1px solid rgba(255,0,255,0.4)}
.sector-metal{background:rgba(192,192,192,0.2);color:#c0c0c0;border:1px solid rgba(192,192,192,0.4)}
.sector-telecom{background:rgba(0,255,157,0.2);color:#00ff9d;border:1px solid rgba(0,255,157,0.4)}
.sector-consumer{background:rgba(255,140,0,0.2);color:#ff8c00;border:1px solid rgba(255,140,0,0.4)}

/* Chart area */
.chart-area{
  display:flex;flex-direction:column;height:100%;
  background:linear-gradient(180deg,rgba(5,5,10,0.9) 0%,rgba(10,15,30,0.95) 100%);
  overflow:hidden;
}
.chart-header{
  padding:18px 20px;border-bottom:1px solid rgba(0,243,255,0.2);
  display:flex;justify-content:space-between;align-items:center;
  background:rgba(0,0,0,0.5);flex-shrink:0;
  position:relative;
}
.chart-header::after{
  content:'';position:absolute;
  bottom:-1px;left:0;right:0;height:1px;
  background:linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
  opacity:0.6;
}
.chart-title{display:flex;align-items:center;gap:15px}
.chart-symbol{font-size:30px;font-weight:900;color:#fff;text-shadow:0 0 12px rgba(255,255,255,0.3);letter-spacing:1px}
.chart-name{color:var(--neon-cyan);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
.chart-sector{color:var(--text-dim);font-size:10px;letter-spacing:1px;margin-top:2px}
.chart-price{text-align:right}
.current-price{font-size:30px;font-weight:700;color:#fff;text-shadow:0 0 15px rgba(255,255,255,0.2);font-family:var(--font-data)}
.price-change{font-size:14px;margin-top:5px;font-weight:600;font-family:var(--font-data)}
.signal-badge{
  display:inline-block;
  font-size:10px;
  padding:3px 10px;
  border-radius:3px;
  margin-top:6px;
  letter-spacing:2px;
  font-weight:700;
  text-transform:uppercase;
}
.signal-buy{background:rgba(0,255,157,0.2);color:#00ff9d;border:1px solid #00ff9d;text-shadow:0 0 6px #00ff9d}
.signal-sell{background:rgba(255,0,85,0.2);color:#ff0055;border:1px solid #ff0055;text-shadow:0 0 6px #ff0055}
.signal-hold{background:rgba(255,215,0,0.15);color:#ffd700;border:1px solid #ffd700}

/* Stats */
.stats-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:12px;
  padding:18px 20px;background:rgba(0,243,255,0.03);
  border-bottom:1px solid rgba(0,243,255,0.2);flex-shrink:0;
}
.stat-item{
  background:rgba(0,0,0,0.45);padding:12px;border-radius:5px;
  border:1px solid rgba(255,255,255,0.05);
  position:relative;overflow:hidden;
  transition:all 0.25s;
}
.stat-item:hover{
  border-color:var(--neon-gold);
  box-shadow:0 0 12px rgba(255,215,0,0.15);
}
.stat-item::after{
  content:'';position:absolute;bottom:0;left:0;width:100%;height:2px;
  background:linear-gradient(90deg, var(--ru-white), var(--ru-blue), var(--ru-red));
}
.stat-label{color:var(--text-dim);font-size:9px;text-transform:uppercase;margin-bottom:6px;letter-spacing:1.5px}
.stat-value{font-size:17px;font-weight:700;font-family:var(--font-data);color:#fff}

/* Chart container */
.chart-container{
  flex:1;min-height:0;padding:10px;position:relative;
  display:flex;flex-direction:column;
}
#chart{
  width:100%;height:100%;min-height:300px;
  border-radius:8px;overflow:hidden;
  box-shadow:inset 0 0 50px rgba(0,0,0,0.8);
}

/* ====== GRAPH OVERLAY / BADGE / RESET ====== */
.chart-overlay{
  position:absolute;
  inset:10px;
  background:rgba(5,5,5,0.85);
  backdrop-filter:blur(4px);
  border-radius:8px;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10;
  pointer-events:none;
}
.chart-overlay.active{display:flex}
.chart-overlay-content{
  text-align:center;
  color:var(--neon-cyan);
  font-family:var(--font-display);
  text-transform:uppercase;
  letter-spacing:2px;
  font-size:11px;
}
.chart-overlay-content i{font-size:28px;margin-bottom:12px;display:block}
.chart-overlay-bar{
  width:200px;height:3px;background:rgba(0,243,255,0.15);
  border-radius:2px;overflow:hidden;margin:10px auto 0;
}
.chart-overlay-bar-fill{
  height:100%;
  background:linear-gradient(90deg,var(--neon-cyan),var(--neon-gold));
  width:0%;
  transition:width 0.3s ease;
  box-shadow:0 0 10px var(--neon-cyan);
}
.chart-badge{
  position:absolute;
  top:18px;left:18px;
  padding:4px 10px;
  background:rgba(0,0,0,0.7);
  border:1px solid rgba(0,243,255,0.3);
  border-radius:3px;
  font-family:var(--font-data);
  font-size:10px;
  color:var(--neon-gold);
  letter-spacing:1px;
  z-index:5;
  pointer-events:none;
}
.chart-reset-btn{
  position:absolute;
  top:18px;right:18px;
  padding:5px 10px;
  background:rgba(0,0,0,0.7);
  border:1px solid rgba(0,243,255,0.3);
  border-radius:3px;
  font-family:var(--font-display);
  font-size:10px;
  color:var(--neon-cyan);
  letter-spacing:1px;
  cursor:pointer;
  transition:all 0.2s;
  z-index:5;
  text-transform:uppercase;
}
.chart-reset-btn:hover{
  border-color:var(--neon-gold);
  color:var(--neon-gold);
  box-shadow:0 0 10px rgba(255,215,0,0.3);
}

/* Timeframe */
.timeframe-selector{
  display:flex;gap:8px;padding:12px 20px;
  background:rgba(0,0,0,0.6);
  border-top:1px solid rgba(0,243,255,0.2);
  justify-content:center;flex-shrink:0;flex-wrap:wrap;
}
.timeframe-btn{
  background:transparent;border:1px solid rgba(0,243,255,0.3);
  color:var(--text-dim);padding:7px 14px;border-radius:3px;
  font-family:var(--font-display);font-size:11px;font-weight:600;
  cursor:pointer;transition:all 0.3s;text-transform:uppercase;
  letter-spacing:1px;
}
.timeframe-btn:hover{
  background:rgba(0,243,255,0.1);color:var(--neon-cyan);
  box-shadow:0 0 10px rgba(0,243,255,0.3);border-color:var(--neon-cyan);
}
.timeframe-btn.active{
  background:linear-gradient(135deg, rgba(0,57,166,0.4), rgba(213,43,30,0.3));
  color:#fff;border-color:var(--neon-gold);
  box-shadow:0 0 15px rgba(255,215,0,0.4);
  text-shadow:0 0 5px var(--neon-gold);
}

/* Orderbook */
.orderbook-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 10px;font-family:var(--font-data);font-size:12px;
  position:relative;margin-bottom:2px;border-radius:3px;
}
.depth-bar{
  position:absolute;top:0;bottom:0;opacity:0.22;z-index:0;border-radius:3px;
}
.depth-bid{right:0;background:var(--neon-green);box-shadow:0 0 8px var(--neon-green)}
.depth-ask{left:0;background:var(--neon-red);box-shadow:0 0 8px var(--neon-red)}
.orderbook-text{
  position:relative;z-index:1;width:100%;
  display:flex;justify-content:space-between;
}
.bid-price{color:var(--neon-green);font-weight:700;text-shadow:0 0 5px var(--neon-green)}
.ask-price{color:var(--neon-red);font-weight:700;text-shadow:0 0 5px var(--neon-red)}

/* News */
.news-item{
  padding:12px 15px;border-bottom:1px solid rgba(255,255,255,0.05);
  cursor:pointer;transition:background 0.2s;
}
.news-item:hover{
  background:rgba(0,243,255,0.05);
  border-left:3px solid var(--neon-gold);
  padding-left:12px;
}
.news-date{
  color:var(--neon-gold);font-size:10px;margin-bottom:5px;
  text-transform:uppercase;letter-spacing:1.5px;
  display:flex;align-items:center;gap:5px;
}
.news-title{font-size:11.5px;line-height:1.5;color:#c8d8f0}

/* Volume legend */
.volume-legend{
  display:flex;gap:16px;margin-top:6px;font-size:10px;
  color:var(--text-dim);flex-shrink:0;
}
.volume-up{display:flex;align-items:center;gap:5px}
.volume-up::before{
  content:'';display:inline-block;width:12px;height:12px;
  background:linear-gradient(135deg, var(--ru-blue), var(--ru-red));
  opacity:0.8;border-radius:2px;
}

/* Utilities */
.text-green{color:var(--neon-green);text-shadow:0 0 5px var(--neon-green)}
.text-red{color:var(--neon-red);text-shadow:0 0 5px var(--neon-red)}
.text-gold{color:var(--neon-gold);text-shadow:0 0 5px var(--neon-gold)}

.loading{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;color:var(--neon-cyan);font-family:var(--font-display);
  text-transform:uppercase;letter-spacing:2px;font-size:11px;
  text-align:center;padding:20px;
}
.blink{animation:blinker 1.5s linear infinite}
@keyframes blinker{50%{opacity:0.3}}

/* Status bar */
.status-bar{
  position:fixed;bottom:0;left:320px;right:340px;
  padding:5px 14px;
  background:linear-gradient(90deg, rgba(15,15,25,0.95), rgba(0,0,0,0.95));
  border-top:1px solid rgba(0,243,255,0.3);
  font-family:var(--font-data);font-size:10px;color:var(--text-dim);
  display:flex;justify-content:space-between;z-index:100;
  letter-spacing:1px;
}
.status-dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--neon-green);box-shadow:0 0 8px var(--neon-green);
  margin-right:6px;animation:pulse 2s infinite;
}
.status-dot.error{background:var(--neon-red);box-shadow:0 0 8px var(--neon-red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

.moscow-clock{
  font-family:var(--font-data);
  color:var(--neon-gold);
  font-size:11px;
  letter-spacing:1px;
}

@media (max-width:1200px){
  .app{grid-template-columns:280px 1fr 300px}
  .status-bar{left:280px;right:300px}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .panel:first-child{max-height:180px}
  .panel:last-child{max-height:180px}
  .status-bar{left:0;right:0}
  .chart-symbol{font-size:22px}
  .current-price{font-size:22px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <!-- Left: Watchlist -->
  <div class="panel">
    <div class="panel-header">
      <span><i class="fas fa-bolt" style="margin-right:8px;color:var(--neon-gold)"></i>MOEX · TQBR</span>
      <span class="blink" style="color:var(--neon-green);font-size:10px">● LIVE</span>
    </div>

    <div class="imoex-banner" id="imoexBanner">
      <div>
        <div class="imoex-label">Indice IMOEX</div>
        <div class="imoex-value" id="imoexValue">---</div>
      </div>
      <div style="text-align:right">
        <div class="imoex-change" id="imoexChange">---</div>
      </div>
    </div>

    <div class="search-bar">
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Rechercher un titre...">
    </div>

    <div class="panel-content" id="watchlist">
      <div class="loading">
        <i class="fas fa-circle-notch fa-spin" style="font-size:22px;margin-bottom:10px"></i>
        Initialisation...
      </div>
    </div>
  </div>

  <!-- Center: Chart -->
  <div class="chart-area">
    <div class="chart-header">
      <div class="chart-title">
        <div>
          <div class="chart-symbol" id="chartSymbol">SBER</div>
          <div class="chart-name" id="chartName">Sberbank</div>
          <div class="chart-sector" id="chartSector">FINANCE · TQBR</div>
        </div>
      </div>
      <div class="chart-price">
        <div class="current-price" id="currentPrice">---</div>
        <div class="price-change" id="priceChange">---</div>
        <div><span class="signal-badge signal-hold" id="signalBadge">HOLD</span></div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-label">Ouverture</div>
        <div class="stat-value" id="statOpen">---</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">+ Haut</div>
        <div class="stat-value" id="statHigh">---</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">+ Bas</div>
        <div class="stat-value" id="statLow">---</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Volume</div>
        <div class="stat-value" id="statVolume">---</div>
      </div>
    </div>

    <div class="chart-container">
      <div id="chart"></div>
      <div class="chart-overlay" id="chartOverlay">
        <div class="chart-overlay-content">
          <i class="fas fa-circle-notch fa-spin"></i>
          <span id="chartOverlayText">CHARGEMENT</span>
          <div class="chart-overlay-bar">
            <div class="chart-overlay-bar-fill" id="chartOverlayBar"></div>
          </div>
        </div>
      </div>
      <div class="chart-badge" id="chartBadge">1M · 30 BOUGIES</div>
      <button class="chart-reset-btn" id="chartResetBtn">
        <i class="fas fa-crosshairs"></i> RESET ZOOM
      </button>
      <div class="volume-legend">
        <span class="volume-up">Volume</span>
      </div>
    </div>

    <div class="timeframe-selector">
      <button class="timeframe-btn" data-timeframe="1D">1J</button>
      <button class="timeframe-btn" data-timeframe="1W">1S</button>
      <button class="timeframe-btn active" data-timeframe="1M">1M</button>
      <button class="timeframe-btn" data-timeframe="3M">3M</button>
      <button class="timeframe-btn" data-timeframe="6M">6M</button>
      <button class="timeframe-btn" data-timeframe="1Y">1A</button>
      <button class="timeframe-btn" data-timeframe="ALL">MAX</button>
    </div>
  </div>

  <!-- Right: Orderbook + News -->
  <div class="panel">
    <div class="panel-header">
      <span><i class="fas fa-microchip" style="margin-right:8px;color:var(--neon-gold)"></i>Carnet d'ordres</span>
      <span style="font-size:10px;color:var(--text-dim)">DEPTH: 20</span>
    </div>
    <div class="panel-content" id="orderbook">
      <div class="loading">
        <i class="fas fa-satellite-dish fa-spin" style="font-size:22px;margin-bottom:10px"></i>
        Connexion...
      </div>
    </div>

    <div class="panel-header">
      <span><i class="fas fa-broadcast-tower" style="margin-right:8px;color:var(--neon-gold)"></i>Flux MOEX</span>
      <span class="moscow-clock" id="moscowClock">--:--:--</span>
    </div>
    <div class="panel-content" id="news">
      <div class="loading">
        <i class="fas fa-wifi fa-spin" style="font-size:22px;margin-bottom:10px"></i>

function fmtNum(n, dec=2){

function fmtVol(v){
  if(!v && v!==0) return '---';
  if(v>=1e9) return (v/1e9).toFixed(2)+'B';
  if(v>=1e6) return (v/1e6).toFixed(2)+'M';
  if(v>=1e3) return (v/1e3).toFixed(2)+'K';
  return v.toString();
}

/* ---------- FETCH AVEC RETRY + ABORT ---------- */
async function fetchWithRetry(url, retries = 3, delayMs = 500, signal){
  for(let i = 0; i < retries; i++){
    if(signal?.aborted) throw new DOMException('Aborted', 'AbortError');
    try{
      const res = await fetch(CORS_PROXY + encodeURIComponent(url), { signal });
      if(res.ok) return res;
      if(res.status === 403 && i < retries - 1){
        await new Promise(r => setTimeout(r, delayMs * (i + 1)));
        continue;
      }
      throw new Error('HTTP ' + res.status);
    }catch(e){
      if(e.name === 'AbortError') throw e;
      if(i === retries - 1) throw e;
      await new Promise(r => setTimeout(r, delayMs * (i + 1)));
    }
  }
}

/* ---------- API MOEX ISS ---------- */
async function fetchCandles(ticker, interval, from, till, signal){
  const url = `${MOEX_BASE}/engines/stock/markets/shares/boards/TQBR/securities/${ticker}/candles.json?from=${from}&till=${till}&interval=${interval}`;
  const res = await fetchWithRetry(url, 3, 500, signal);
  const json = await res.json();
  if(!json.candles) throw new Error('Réponse invalide');
  const { columns, data } = json.candles;
  return data.map(row=>{
    const o = {};
    columns.forEach((c,i)=> o[c]=row[i]);
    return {
      time:  o.begin.slice(0,10),
      open:  parseFloat(o.open),
      high:  parseFloat(o.high),
      low:   parseFloat(o.low),
      close: parseFloat(o.close),
      volume:parseInt(o.volume)||0
    };
  });
}

async function fetchQuote(ticker){
  const url = `${MOEX_BASE}/engines/stock/markets/shares/boards/TQBR/securities/${ticker}.json?iss.meta=off`;
  const res = await fetchWithRetry(url);
  const json = await res.json();

  const md = json.marketdata;
  if(!md || !md.data || md.data.length===0) throw new Error('Pas de marketdata');
  const mdObj = {};
  md.columns.forEach((c,i)=> mdObj[c]=md.data[0][i]);

  const sec = json.securities;
  const secObj = {};
  sec.columns.forEach((c,i)=> secObj[c]=sec.data[0][i]);

  return {
    ticker:    secObj.SECID,
    name:      secObj.SHORTNAME || secObj.SECNAME,
    last:      mdObj.LAST || mdObj.MARKETPRICE || secObj.PREVPRICE,
    open:      mdObj.OPEN,
    high:      mdObj.HIGH,
    low:       mdObj.LOW,
    volume:    mdObj.VOLTODAY,
    value:     mdObj.VALTODAY,
    changePct: mdObj.LASTCHANGEPRCNT,
    prevClose: secObj.PREVPRICE,
    bid:       mdObj.BID,
    ask:       mdObj.OFFER,
    time:      mdObj.TIME,
    updated:   mdObj.UPDATETIME || new Date().toLocaleTimeString('fr-FR')
  };
}

async function fetchOrderbook(ticker){
  const url = `${MOEX_BASE}/engines/stock/markets/shares/boards/TQBR/securities/${ticker}/orderbook.json?iss.meta=off`;
  try{
    const res = await fetchWithRetry(url, 2);
    const json = await res.json();
    const ob = json.orderbook;
    if(!ob || !ob.data || ob.data.length===0) return null;

    const rows = ob.data.map(row=>{
      const o = {};
      ob.columns.forEach((c,i)=> o[c]=row[i]);
      return o;
    });

    const bids = rows.filter(r=> r.BUYSELL==='B' || r.BUYSELL==='BID')
                     .sort((a,b)=> b.PRICE - a.PRICE);
    const asks = rows.filter(r=> r.BUYSELL==='S' || r.BUYSELL==='ASK')
                     .sort((a,b)=> a.PRICE - b.PRICE);
    return { bids, asks };
  }catch(e){
    console.warn('Orderbook indisponible:', e.message);
    return null;
  }
}

async function fetchIMOEX(){
  const url = `${MOEX_BASE}/engines/stock/markets/index/boards/SNDX/securities/IMOEX.json?iss.meta=off`;
  try{
    const res = await fetchWithRetry(url, 2);
    const json = await res.json();
    const md = json.marketdata;
    if(!md || !md.data || md.data.length===0) return null;
    const obj = {};
    md.columns.forEach((c,i)=> obj[c]=md.data[0][i]);
    return {
      value: obj.CURRENTVALUE || obj.LASTVALUE,
      changePct: obj.LASTCHANGEPRCNT
    };
  }catch(e){
    return null;
  }
}

/* ---------- CACHE LOCAL ---------- */
const candleCache = new Map();
const CACHE_TTL_MS = 60 * 1000;

function getCacheKey(ticker, timeframe){
  return `${ticker}|${timeframe}`;
}
function getCachedCandles(ticker, timeframe){
  const key = getCacheKey(ticker, timeframe);
  const cached = candleCache.get(key);
  if(!cached) return null;
  if(Date.now() - cached.timestamp > CACHE_TTL_MS){
    candleCache.delete(key);
    return null;
  }
  return cached.data;
}
function setCachedCandles(ticker, timeframe, data){
  const key = getCacheKey(ticker, timeframe);
  candleCache.set(key, { data, timestamp: Date.now() });
  if(candleCache.size > 50){
    const firstKey = candleCache.keys().next().value;
    candleCache.delete(firstKey);
  }
}

/* ---------- ABORT CONTROLLER ---------- */
let currentAbortController = null;

/* ---------- UPDATE CHART ---------- */
async function updateChart(ticker, timeframe){
  if(currentAbortController){
    currentAbortController.abort();
  }
  currentAbortController = new AbortController();
  const signal = currentAbortController.signal;

  // Cache
  const cached = getCachedCandles(ticker, timeframe);
  if(cached){
    applyCandlesToChart(cached);
    updateChartBadge(timeframe, cached.length);
    setStatus(`OK (cache) — ${cached.length} bougies`);
    return;
  }

  showChartOverlay(`CHARGEMENT ${ticker} ${timeframe}`, 10);
  state.isLoading = true;
  setStatus(`Chargement ${ticker} ${timeframe}...`);

  try{
    const cfg  = TIMEFRAME_MAP[timeframe] || TIMEFRAME_MAP['1M'];
    const till = new Date();
    const from = new Date(Date.now() - cfg.days*86400000);

    showChartOverlay(`CHARGEMENT ${ticker} ${timeframe}`, 40);

    const candles = await fetchCandles(
      ticker, cfg.interval, fmtDate(from), fmtDate(till), signal
    );

    if(signal.aborted) return;

    showChartOverlay(`RENDU ${candles.length} BOUGIES`, 80);

    if(candles.length === 0) throw new Error('Aucune bougie');

    applyCandlesToChart(candles);
    updateChartBadge(timeframe, candles.length);
    setCachedCandles(ticker, timeframe, candles);

    showChartOverlay('TERMINÉ', 100);
    setTimeout(hideChartOverlay, 200);

    setStatus(`OK — ${candles.length} bougies`);
  }catch(e){
    if(e.name === 'AbortError'){
      console.log('Requête annulée (changement rapide)');
      return;
    }
    console.error('updateChart:', e);
    setStatus('Erreur: ' + e.message, true);
    hideChartOverlay();
  }finally{
    state.isLoading = false;
  }
}

/* ---------- APPLY CANDLES ---------- */
function applyCandlesToChart(candles){
  state.candleSeries.setData(candles.map(c=>({
    time: c.time,
    open: c.open,
    high: c.high,
    low:  c.low,
    close:c.close
  })));

  state.volumeSeries.setData(candles.map(c=>({
    time: c.time,
    value: c.volume,
    color: c.close >= c.open
      ? 'rgba(0,255,157,0.45)'
      : 'rgba(255,0,85,0.45)'
  })));

  state.chart.timeScale().fitContent();
}

/* ---------- WATCHLIST ---------- */
let watchlistData = [];

async function renderWatchlist(){
  const container = document.getElementById('watchlist');
  if(!container.querySelector('.watchlist-item')){
    container.innerHTML = '<div class="loading"><i class="fas fa-circle-notch fa-spin" style="font-size:20px;margin-bottom:8px"></i>Chargement...</div>';
  }

  const results = [];
  for(let i = 0; i < TICKERS.length; i++){
    try{
      const q = await fetchQuote(TICKERS[i].symbol);
      results.push({ status:'fulfilled', value:q });
    }catch(e){
      results.push({ status:'rejected', reason:e });
    }
    await new Promise(r => setTimeout(r, 150));
  }

  watchlistData = results.map((r, i) => ({
    ticker: TICKERS[i],
    quote: r.status === 'fulfilled' ? r.value : null
  }));

  renderFilteredWatchlist();
}

function renderFilteredWatchlist(){
  const container = document.getElementById('watchlist');
  const filter = state.searchFilter.toLowerCase();

  const filtered = watchlistData.filter(item => {
    if(!filter) return true;
    return item.ticker.symbol.toLowerCase().includes(filter) ||
           item.ticker.name.toLowerCase().includes(filter);
  });

  if(filtered.length === 0){
    container.innerHTML = '<div class="loading">Aucun résultat</div>';
    return;
  }

  let html = '';
  filtered.forEach(item => {
    const t = item.ticker;
    const q = item.quote;
    const activeClass = t.symbol === state.currentTicker ? 'active' : '';

    if(q){
      const change = q.changePct ?? 0;
      const cls = change >= 0 ? 'text-green' : 'text-red';
      const sign = change >= 0 ? '+' : '';
      const alertClass = Math.abs(change) > 3 ? 'alert' : '';

      html += `
        <div class="watchlist-item ${activeClass} ${alertClass}" onclick="selectTicker('${t.symbol}')">
          <div style="flex:1;min-width:0">
            <div class="watchlist-symbol">${t.symbol}
              <span class="sector-badge sector-${t.sector}">${SECTOR_LABELS[t.sector] || t.sector}</span>
            </div>
            <div class="watchlist-name">${t.name}</div>
          </div>
          <div style="text-align:right;flex-shrink:0;margin-left:8px">
            <div class="watchlist-price">${fmtNum(q.last)}</div>
            <div class="watchlist-change ${cls}">${sign}${change.toFixed(2)}%</div>
          </div>
        </div>`;
    } else {
      html += `
        <div class="watchlist-item ${activeClass}" onclick="selectTicker('${t.symbol}')">
          <div style="flex:1">
            <div class="watchlist-symbol">${t.symbol}</div>
            <div class="watchlist-name">${t.name}</div>
          </div>
          <div style="text-align:right">
            <div class="watchlist-price">N/A</div>
            <div class="watchlist-change text-red">err</div>
          </div>
        </div>`;
    }
  });
  container.innerHTML = html;
}

/* ---------- STATS ---------- */
function updateStats(q){
  const price = q.last || q.prevClose;
  const change = q.changePct || 0;

  const elP = document.getElementById('currentPrice');
  elP.textContent = fmtNum(price) + ' ₽';
  elP.style.color = change >= 0 ? 'var(--neon-green)' : 'var(--neon-red)';
  elP.style.textShadow = change >= 0
    ? '0 0 10px var(--neon-green)'
    : '0 0 10px var(--neon-red)';

  const elC = document.getElementById('priceChange');
  elC.innerHTML = `${change>=0?'+':''}${change.toFixed(2)}%`;
  elC.className = `price-change ${change>=0?'text-green':'text-red'}`;

  const badge = document.getElementById('signalBadge');
  if(change >= 1.5){
    badge.textContent = 'BUY ▲';
    badge.className = 'signal-badge signal-buy';
  }else if(change <= -1.5){
    badge.textContent = 'SELL ▼';
    badge.className = 'signal-badge signal-sell';
  }else{
    badge.textContent = 'HOLD ●';
    badge.className = 'signal-badge signal-hold';
  }

  document.getElementById('statOpen').textContent   = fmtNum(q.open);
  document.getElementById('statHigh').textContent   = fmtNum(q.high);
  document.getElementById('statLow').textContent    = fmtNum(q.low);
  document.getElementById('statVolume').textContent = fmtVol(q.volume);
}

/* ---------- ORDERBOOK ---------- */
async function renderOrderbook(ticker){
  const container = document.getElementById('orderbook');
  const ob = await fetchOrderbook(ticker);
  const q  = await fetchQuote(ticker).catch(()=>null);

  if(!ob || (ob.bids.length===0 && ob.asks.length===0)){
    if(q && q.bid && q.ask){
      let html = '<div style="padding:8px;font-size:9px;color:var(--text-dim);text-align:center">⚠ Carnet réel indisponible — simulation</div>';
      const mid  = (q.bid + q.ask) / 2;
      const step = Math.max(0.01, (q.ask - q.bid) / 2);

      for(let i=5;i>=1;i--){
        const price = q.ask + i*step;
        const vol   = Math.floor(Math.random()*50000)+1000;
        const depth = Math.min(100, (vol/50000)*100);
        html += `
          <div class="orderbook-row">
            <div class="depth-bar depth-ask" style="width:${depth}%"></div>
            <div class="orderbook-text">
              <span class="ask-price">${fmtNum(price)}</span>
              <span>${vol.toLocaleString('fr-FR')}</span>
              <span></span>
            </div>
          </div>`;
      }

      html += `<div style="text-align:center;padding:8px;background:rgba(0,0,0,0.4);margin:6px 0;border-radius:4px;color:var(--neon-gold);font-size:10px">
        SPREAD ${fmtNum(q.ask-q.bid)} (${((q.ask-q.bid)/mid*100).toFixed(3)}%)
      </div>`;

      for(let i=1;i<=5;i++){
        const price = q.bid - i*step;
        const vol   = Math.floor(Math.random()*50000)+1000;
        const depth = Math.min(100, (vol/50000)*100);
        html += `
          <div class="orderbook-row">
            <div class="depth-bar depth-bid" style="width:${depth}%"></div>
            <div class="orderbook-text">
              <span></span>
              <span>${vol.toLocaleString('fr-FR')}</span>
              <span class="bid-price">${fmtNum(price)}</span>
            </div>
          </div>`;
      }
      container.innerHTML = html;
      return;
    }
    container.innerHTML = '<div class="loading">Aucune donnée</div>';
    return;
  }

  const maxVol = Math.max(
    ...ob.bids.map(b=>b.QUANTITY||0),
    ...ob.asks.map(a=>a.QUANTITY||0),
    1
  );

  let html = '';

  ob.asks.slice(0,10).reverse().forEach(a=>{
    const depth = ((a.QUANTITY||0)/maxVol)*100;
    html += `
      <div class="orderbook-row">
        <div class="depth-bar depth-ask" style="width:${depth}%"></div>
        <div class="orderbook-text">
          <span class="ask-price">${fmtNum(a.PRICE)}</span>
          <span>${(a.QUANTITY||0).toLocaleString('fr-FR')}</span>
          <span></span>
        </div>
      </div>`;
  });

  const bestBid = ob.bids[0]?.PRICE;
  const bestAsk = ob.asks[0]?.PRICE;
  const spread  = (bestBid && bestAsk) ? (bestAsk - bestBid) : null;

  html += `<div style="text-align:center;padding:8px;background:rgba(0,0,0,0.4);margin:6px 0;border-radius:4px;color:var(--neon-gold);font-size:10px">
    SPREAD ${spread!==null?fmtNum(spread):'---'}
    ${spread!==null && bestBid ? `(${(spread/bestBid*100).toFixed(3)}%)` : ''}
  </div>`;

  ob.bids.slice(0,10).forEach(b=>{
    const depth = ((b.QUANTITY||0)/maxVol)*100;
    html += `
      <div class="orderbook-row">
        <div class="depth-bar depth-bid" style="width:${depth}%"></div>
        <div class="orderbook-text">
          <span></span>
          <span>${(b.QUANTITY||0).toLocaleString('fr-FR')}</span>
          <span class="bid-price">${fmtNum(b.PRICE)}</span>
        </div>
      </div>`;
  });

  container.innerHTML = html;
}

  document.getElementById('news').innerHTML = news.map(n=>`
    <div class="news-item">
      <div class="news-date"><i class="far fa-clock"></i>${n.date}</div>
      <div class="news-title">${n.title}</div>
    </div>`).join('');
}

/* ---------- SELECT TICKER ---------- */
async function selectTicker(ticker){
  state.currentTicker = ticker;
  const info = getTickerInfo(ticker);

  document.getElementById('chartSymbol').textContent = ticker;
  document.getElementById('chartName').textContent = info.name;
  document.getElementById('chartSector').textContent =
    (SECTOR_LABELS[info.sector] || info.sector) + ' · TQBR';

  await Promise.allSettled([
    updateChart(ticker, state.currentTimeframe),
    renderOrderbook(ticker),
    (async()=>{
      try{
        const q = await fetchQuote(ticker);
        updateStats(q);
      }catch(e){ console.warn('quote err', e); }
    })()
  ]);

  renderFilteredWatchlist();
}

/* ---------- TIMEFRAMES (avec debounce) ---------- */
function setupTimeframes(){
  let debounceTimer;
  document.querySelectorAll('.timeframe-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      document.querySelectorAll('.timeframe-btn').forEach(b=>b.classList.remove('active'));
      e.target.classList.add('active');
      state.currentTimeframe = e.target.dataset.timeframe;

      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(()=>{
        updateChart(state.currentTicker, state.currentTimeframe);
      }, 250);
    });
  });
}

/* ---------- SEARCH ---------- */
function setupSearch(){
  const input = document.getElementById('searchInput');
  input.addEventListener('input', e=>{
    state.searchFilter = e.target.value.trim();
    renderFilteredWatchlist();
  });
}

/* ---------- IMOEX ---------- */
async function updateIMOEX(){
  const data = await fetchIMOEX();
  if(data && data.value){
    document.getElementById('imoexValue').textContent = fmtNum(data.value);
    const change = data.changePct ?? 0;
    const el = document.getElementById('imoexChange');
    el.innerHTML = `${change>=0?'+':''}${change.toFixed(2)}%`;
    el.className = `imoex-change ${change>=0?'text-green':'text-red'}`;
  }
}

/* ---------- MOSCOW CLOCK ---------- */
function updateMoscowClock(){
  const now = new Date();
  const moscow = new Date(now.getTime() + (now.getTimezoneOffset() + 180) * 60000);
  const hh = String(moscow.getHours()).padStart(2,'0');
  const mm = String(moscow.getMinutes()).padStart(2,'0');
  const ss = String(moscow.getSeconds()).padStart(2,'0');
  document.getElementById('moscowClock').textContent = `${hh}:${mm}:${ss} MSK`;
}

/* ---------- AUTO REFRESH ---------- */
function startRefreshLoop(){
  setInterval(async ()=>{
    try{
      const q = await fetchQuote(state.currentTicker);
      updateStats(q);
      await renderOrderbook(state.currentTicker);
    }catch(e){ console.warn('refresh err', e); }
  }, 45000);

  setInterval(renderWatchlist, 90000);
  setInterval(updateIMOEX, 60000);
  setInterval(updateMoscowClock, 1000);
}

/* ---------- INIT ---------- */
async function init(){
  initChart();
  renderNews();
  setupTimeframes();
  setupSearch();
  updateMoscowClock();
  updateIMOEX();

  try{
    const q = await fetchQuote(state.currentTicker);
    updateStats(q);
    if(q.name) document.getElementById('chartName').textContent = q.name;
  }catch(e){ console.warn('init quote err', e); }

  await updateChart(state.currentTicker, state.currentTimeframe);
  await renderOrderbook(state.currentTicker);
  await renderWatchlist();

  startRefreshLoop();
  setStatus('SYSTÈME EN LIGNE');
}

window.selectTicker = selectTicker;
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
